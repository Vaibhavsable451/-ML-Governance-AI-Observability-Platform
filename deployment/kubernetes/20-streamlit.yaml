apiVersion: apps/v1
kind: Deployment
metadata: {name: streamlit, namespace: ai-governance}
spec:
  replicas: 2
  selector: {matchLabels: {app: streamlit}}
  strategy: {rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  template:
    metadata: {labels: {app: streamlit}}
    spec:
      imagePullSecrets: [{name: ecr-pull}]
      containers:
        - name: streamlit
          image: 851435022143.dkr.ecr.eu-north-1.amazonaws.com/ai-governance-ui:latest
          ports: [{containerPort: 8501}]
          env: [{name: API_URL, value: "http://api-service:8000"}]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 768Mi}
          readinessProbe: {httpGet: {path: /_stcore/health, port: 8501}, initialDelaySeconds: 10}
          livenessProbe: {httpGet: {path: /_stcore/health, port: 8501}, initialDelaySeconds: 30}
---
apiVersion: v1
kind: Service
metadata: {name: streamlit-service, namespace: ai-governance}
spec:
  type: NodePort
  selector: {app: streamlit}
  ports: [{port: 8501, targetPort: 8501, nodePort: 30080}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: streamlit, namespace: ai-governance}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: streamlit}
  minReplicas: 2
  maxReplicas: 4
  metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}}]
