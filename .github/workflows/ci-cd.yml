name: ci-cd
on:
  push: {branches: [main]}
  pull_request:
permissions: {id-token: write, contents: read}
env:
  AWS_REGION: us-east-1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt -r requirements-ui.txt -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install bandit pip-audit
      - run: bandit -r core ml agents rag monitoring backend -ll
      - run: pip-audit -r requirements.txt
      - uses: aquasecurity/trivy-action@0.24.0
        with: {scan-type: fs, severity: "CRITICAL,HIGH", ignore-unfixed: true, exit-code: "1"}

  build-push:
    if: github.ref == 'refs/heads/main'
    needs: [test, security]
    runs-on: ubuntu-latest
    outputs: {registry: "${{ steps.ecr.outputs.registry }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with: {role-to-assume: "${{ secrets.AWS_DEPLOY_ROLE_ARN }}", aws-region: "${{ env.AWS_REGION }}"}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - name: Build and push api / ui / mlflow
        run: |
          for svc in api ui mlflow; do
            img=${{ steps.ecr.outputs.registry }}/ai-governance-$svc
            docker buildx build -f deployment/docker/Dockerfile.$svc -t $img:${{ github.sha }} -t $img:latest --push \
              --cache-from type=gha,scope=$svc --cache-to type=gha,mode=max,scope=$svc .
          done

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with: {role-to-assume: "${{ secrets.AWS_DEPLOY_ROLE_ARN }}", aws-region: "${{ env.AWS_REGION }}"}
      - name: Rolling update on the EC2 k3s node (via SSM, no SSH keys)
        run: |
          REG=${{ needs.build-push.outputs.registry }}; TAG=${{ github.sha }}
          CMD="export KUBECONFIG=/etc/rancher/k3s/k3s.yaml; \
            kubectl -n ai-governance set image deployment/api api=$REG/ai-governance-api:$TAG; \
            kubectl -n ai-governance set image deployment/streamlit streamlit=$REG/ai-governance-ui:$TAG; \
            kubectl -n ai-governance rollout status deployment/api --timeout=300s; \
            kubectl -n ai-governance rollout status deployment/streamlit --timeout=300s"
          ID=$(aws ssm send-command --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" --document-name AWS-RunShellScript \
               --parameters commands="$CMD" --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id $ID --instance-id "${{ secrets.EC2_INSTANCE_ID }}"
          aws ssm get-command-invocation --command-id $ID --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --query StandardOutputContent --output text
